plugins {
    id 'java'
    id 'java-library'
    id "com.gradleup.shadow" version "9.3.0"
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

configurations {
    shade
    implementation.extendsFrom shade
}

repositories {
    mavenCentral()

    flatDir {
        dirs("libs")
    }
}

dependencies {
    //minecraft "com.mojang:minecraft:${project.minecraft_version}"
    //mappings loom.officialMojangMappings()
    //modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    def deps = [
            "com.zaxxer:HikariCP:7.0.2",
            "org.mariadb.jdbc:mariadb-java-client:3.5.6",
            "org.postgresql:postgresql:42.7.8",
            "org.xerial:sqlite-jdbc:3.50.3.0"
    ]

    deps.each { dep ->
        api dep
        shade dep
    }

    api platform("org.hibernate.orm:hibernate-platform:7.2.0.Final")
    shade platform("org.hibernate.orm:hibernate-platform:7.2.0.Final")
    api shade("org.hibernate.orm:hibernate-core")
    api shade("org.hibernate.orm:hibernate-hikaricp")
    api shade("org.hibernate.orm:hibernate-community-dialects")

    compileOnly(":HytaleServer")
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier.set('shaded')

    mergeServiceFiles()
}

processResources {
    var expandProps = [
            'name'       : project.name,
            'version'    : project.version,
            'group'      : project.group,
            'entry_point': project.entry_point
    ]

    filesMatching(['manifest.json']) {
        expand expandProps
    }
}


def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
